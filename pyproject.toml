[project]
name = "whosevoice"
version = "0.1.0"
description = "Closed-set principal attribution for covertly poisoned corpora and secretly loyal models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.34",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43"]
dev = ["pytest>=8.0"]

[project.scripts]
whosevoice = "whosevoice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whosevoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
